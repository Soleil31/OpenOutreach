# local.yml

services:
  app:
    build:
      context: .
      dockerfile: ./compose/linkedin/Dockerfile
      args:
        - BUILD_ENV=local
    restart: unless-stopped
    # Reap zombie Chromium/crashpad subprocesses (belt-and-suspenders with the
    # tini ENTRYPOINT) and keep headroom so repeated browser restarts can't
    # exhaust the container PID table. Production compose files should set both.
    init: true
    pids_limit: 4096
    stdin_open: true
    tty: true
    environment:
      - ENABLE_VNC=true
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    volumes:
      - .:/app
    ports:
      - "6080:6080"
